<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura/Fechamento de Caixa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container glass-card">
        <h2 id="pageTitle">Processando...</h2>
        
        <p id="lblDescricao" class="subtitle">Informe o valor (R$):</p>
        
        <div class="form-group">
            <input type="text" id="valor" class="input-money" value="0,00" autocomplete="off">
        </div>

        <div class="actions">
            <button class="btn btn-outline" id="btnCancel">CANCELAR</button>
            <button class="btn btn-primary" id="btnConfirm">CONFIRMAR</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
