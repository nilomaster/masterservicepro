<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lançamento Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
        :root {
            --bg-color: #1a1d24;
            --card-bg: rgba(30, 34, 43, 0.6);
            --border-color: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #8b92a5;
            --accent-blue: #3b82f6;
            --neon-blue: #0088ff;
            --success-green: #22c55e;
            --warning-orange: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
        }

        .modal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .modal-body {
            padding: 25px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .modal-footer {
            padding: 20px 25px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .modal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .modal-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .custom-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 10px auto;
        }

        .custom-select option {
            background: var(--bg-color);
        }

        .pay-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .pay-info-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .pay-info-box p {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .pay-info-box h3 {
            font-size: 24px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .btn-neon {
            background: linear-gradient(135deg, #4da6ff 0%, #0073e6 100%);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 115, 230, 0.5);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(0, 115, 230, 0.8);
            transform: translateY(-2px);
        }

        .btn-neon.success {
            background: var(--success-green);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }
        
        .btn-neon.success:hover {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkbox-container input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            background-color: rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-container input[type="checkbox"]:checked {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .checkbox-container input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-container span {
            font-size: 14px;
            font-weight: 500;
        }

    </style>
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <h2>LANÇAMENTO FINANCEIRO (O.S.)</h2>
        </div>
        <div class="modal-body">
            <div class="pay-grid">
                <div class="pay-info-box">
                    <p>TOTAL DA O.S.</p>
                    <h3 id="lblTotalOS" style="color: var(--neon-blue);">R$ 0,00</h3>
                </div>
                <div class="pay-info-box">
                    <p>TROCO</p>
                    <h3 id="lblTroco" style="color: var(--success-green);">R$ 0,00</h3>
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <label class="label">FORMA DE PAGAMENTO</label>
                <select class="custom-select" id="cboFormaPagamento" onchange="handlePaymentMethodChange()">
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Pix" selected>Pix</option>
                    <option value="Transferência Bancária">Transferência Bancária</option>
                    <option value="misto">Misto</option>
                </select>
            </div>
            
            <div id="valorRecebidoContainer" style="margin-top: 15px;">
                <label class="label">VALOR RECEBIDO (R$)</label>
                <input type="number" class="modal-input" id="valorRecebidoInput" placeholder="0,00" step="0.01" style="font-size: 24px;" onkeyup="calculateTroco()">
            </div>
            
            <div id="mistoInputs" style="display: none; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;">
                <p class="label" style="margin-bottom: 15px;">INFORME OS VALORES</p>
                <div style="display: flex; gap: 10px; margin-bottom: 0;">
                    <div style="flex: 1;">
                        <label class="label" style="font-size: 10px;">DINHEIRO</label>
                        <input type="number" class="modal-input" id="mistoDinheiro" placeholder="0,00" step="0.01" onkeyup="calculateTroco()" style="margin-bottom: 0;">
                    </div>
                    <div style="flex: 1;">
                        <label class="label" style="font-size: 10px;">PIX</label>
                        <input type="number" class="modal-input" id="mistoPix" placeholder="0,00" step="0.01" onkeyup="calculateTroco()" style="margin-bottom: 0;">
                    </div>
                    <div style="flex: 1;">
                        <label class="label" style="font-size: 10px;">CARTÃO</label>
                        <input type="number" class="modal-input" id="mistoCartao" placeholder="0,00" step="0.01" onkeyup="calculateTroco()" style="margin-bottom: 0;">
                    </div>
                    <div style="flex: 1;">
                        <label class="label" style="font-size: 10px;">SALDO</label>
                        <input type="number" class="modal-input" id="mistoSaldo" placeholder="0,00" step="0.01" onkeyup="calculateTroco()" style="margin-bottom: 0;">
                    </div>
                </div>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="chkRecebido" checked>
                <span>Valor já recebido? (Lançar no Caixa)</span>
            </label>
        </div>
        <div class="modal-footer">
            <button class="btn-outline" onclick="sendAction('CANCEL')">CANCELAR</button>
            <button class="btn-neon success" onclick="confirmar()">CONFIRMAR PAGAMENTO</button>
        </div>
    </div>

    <script>
        let totalValueOS = 0;

        function sendAction(actionName, data = null) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ action: actionName, data: data });
            }
        }

        function loadFormData(dataJson) {
            const data = JSON.parse(dataJson);
            totalValueOS = data.ValorCobrado;
            
            const valFormatado = totalValueOS.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('lblTotalOS').innerText = `R$ ${valFormatado}`;
            
            // Set default received value
            document.getElementById('valorRecebidoInput').value = totalValueOS.toFixed(2);
            calculateTroco();
        }

        function handlePaymentMethodChange() {
            const method = document.getElementById('cboFormaPagamento').value;
            const recebidoContainer = document.getElementById('valorRecebidoContainer');
            const mistoInputs = document.getElementById('mistoInputs');
            
            if (method === 'misto') {
                recebidoContainer.style.display = 'none';
                mistoInputs.style.display = 'block';
            } else {
                recebidoContainer.style.display = 'block';
                mistoInputs.style.display = 'none';
            }
            calculateTroco();
        }

        function calculateTroco() {
            const method = document.getElementById('cboFormaPagamento').value;
            let recebido = 0;
            
            if (method === 'misto') {
                const din = parseFloat(document.getElementById('mistoDinheiro').value) || 0;
                const pix = parseFloat(document.getElementById('mistoPix').value) || 0;
                const car = parseFloat(document.getElementById('mistoCartao').value) || 0;
                const sal = parseFloat(document.getElementById('mistoSaldo').value) || 0;
                recebido = din + pix + car + sal;
            } else {
                recebido = parseFloat(document.getElementById('valorRecebidoInput').value) || 0;
            }
            
            let troco = recebido - totalValueOS;
            if (troco < 0) troco = 0;
            
            document.getElementById('lblTroco').innerText = `R$ ${troco.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function confirmar() {
            const formaPagamento = document.getElementById('cboFormaPagamento').value;
            const jaRecebido = document.getElementById('chkRecebido').checked;

            let recebido = 0;
            let troco = 0;
            
            let mistoDin = 0;
            let mistoPix = 0;
            let mistoCar = 0;
            let mistoSal = 0;

            if (formaPagamento === 'misto') {
                mistoDin = parseFloat(document.getElementById('mistoDinheiro').value) || 0;
                mistoPix = parseFloat(document.getElementById('mistoPix').value) || 0;
                mistoCar = parseFloat(document.getElementById('mistoCartao').value) || 0;
                mistoSal = parseFloat(document.getElementById('mistoSaldo').value) || 0;
                recebido = mistoDin + mistoPix + mistoCar + mistoSal;
            } else {
                recebido = parseFloat(document.getElementById('valorRecebidoInput').value) || 0;
            }
            
            troco = recebido - totalValueOS;
            if (troco < 0) troco = 0;

            if (jaRecebido && recebido < totalValueOS) {
                alert('O valor recebido é menor que o total da O.S.!');
                return;
            }

            sendAction('CONFIRMAR', {
                FormaPagamento: formaPagamento,
                JaRecebido: jaRecebido,
                ValorRecebido: recebido,
                Troco: troco,
                MistoDinheiro: mistoDin,
                MistoPix: mistoPix,
                MistoCartao: mistoCar,
                MistoSaldo: mistoSal
            });
        }
    </script>
</body>
</html>
