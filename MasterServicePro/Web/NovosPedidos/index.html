<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novos Pedidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-app: #1A1D24;
            --bg-card: #222630;
            --bg-card-hover: #2A2F3B;
            --bg-sidebar: #1E2129;
            --element-border: #333845;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --whatsapp: #25D366;
            --whatsapp-hover: #128C7E;
            --text-title: #F8FAFC;
            --text-body: #CBD5E1;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-body); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 24px 32px; background-color: var(--bg-card); border-bottom: 1px solid var(--element-border); }
        .title-area h1 { color: var(--text-title); font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .title-area h1 i { color: var(--warning); }
        .title-area p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .header-actions { display: flex; gap: 12px; }

        .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-whatsapp { background-color: var(--whatsapp); color: white; box-shadow: 0 4px 6px rgba(37, 211, 102, 0.2); }
        .btn-whatsapp:hover { background-color: var(--whatsapp-hover); transform: translateY(-1px); }
        .btn-secondary { background-color: var(--bg-sidebar); color: var(--text-title); border: 1px solid var(--element-border); }
        .btn-secondary:hover { background-color: var(--bg-card-hover); }

        /* TOOLBAR */
        .toolbar { padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .search-box { position: relative; flex: 1; max-width: 400px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }
        .search-box input { width: 100%; background-color: var(--bg-card); border: 1px solid var(--element-border); color: var(--text-title); padding: 12px 16px 12px 42px; border-radius: 8px; font-size: 14px; transition: all 0.2s; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        /* CONTENT */
        .content { flex: 1; padding: 0 32px 32px 32px; overflow-y: auto; }
        .table-container { background-color: var(--bg-card); border-radius: 12px; border: 1px solid var(--element-border); overflow: hidden; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--bg-sidebar); color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; padding: 16px 20px; border-bottom: 1px solid var(--element-border); }
        td { padding: 16px 20px; font-size: 14px; border-bottom: 1px solid var(--element-border); color: var(--text-body); }
        tbody tr:hover { background-color: var(--bg-card-hover); }

        .prod-name { color: var(--text-title); font-weight: 500; }
        .prod-code { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        .input-qtd { background-color: var(--bg-app); border: 1px solid var(--element-border); color: var(--text-title); padding: 8px 12px; border-radius: 6px; font-size: 14px; width: 80px; text-align: center; }
        .input-qtd:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-app); }
        ::-webkit-scrollbar-thumb { background: var(--element-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; color: var(--success); margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1><i class="ri-shopping-cart-2-line"></i> Novos Pedidos (Reposição)</h1>
            <p id="prod-count">Carregando lista de reposição...</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="action('atualizar')">
                <i class="ri-refresh-line"></i> Atualizar
            </button>
            <button class="btn btn-whatsapp" onclick="copiarWhatsApp()">
                <i class="ri-whatsapp-line"></i> Copiar Pedido p/ WhatsApp
            </button>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="ri-search-line"></i>
            <input type="text" id="searchInput" placeholder="Buscar por código ou nome..." onkeyup="filterData()">
        </div>
    </div>

    <div class="content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Marca / Modelo</th>
                        <th>Estoque Atual</th>
                        <th>Mínimo</th>
                        <th>Qtd. a Pedir</th>
                    </tr>
                </thead>
                <tbody id="produtos-tbody">
                </tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <i class="ri-checkbox-circle-line"></i>
                <h3>Sem necessidades de reposição</h3>
                <p>Nenhum produto está com estoque muito baixo no momento.</p>
            </div>
        </div>
    </div>

    <script>
        let produtosData = [];

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                try {
                    const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                    if (msg.action === 'load_data') {
                        produtosData = msg.data;
                        filterData();
                    }
                } catch(e) { console.error(e); }
            });
            window.chrome.webview.postMessage({ action: 'request_data' });
        } else {
            produtosData = [
                { Id: 1, Nome: "Amortecedor Dianteiro", CodigoInterno: "AM-100", Marca: "Monroe", Modelo: "Gol G5", Estoque: 0, EstoqueMinimo: 5, QtdPedir: 5 },
                { Id: 2, Nome: "Filtro de Óleo", CodigoInterno: "FO-200", Marca: "Tecfil", Modelo: "Universal", Estoque: 1, EstoqueMinimo: 10, QtdPedir: 9 }
            ];
            filterData();
        }

        function filterData() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            let filtered = produtosData;
            
            if (termo) {
                filtered = filtered.filter(p => 
                    (p.Nome && p.Nome.toLowerCase().includes(termo)) ||
                    (p.CodigoInterno && p.CodigoInterno.toLowerCase().includes(termo))
                );
            }
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('produtos-tbody');
            const emptyState = document.getElementById('empty-state');
            const countLabel = document.getElementById('prod-count');
            
            tbody.innerHTML = '';
            
            if (!data || data.length === 0) {
                emptyState.style.display = 'block';
                countLabel.innerText = `Nenhum item precisando reposição.`;
                document.querySelector('table').style.display = 'none';
                return;
            }

            document.querySelector('table').style.display = 'table';
            emptyState.style.display = 'none';
            countLabel.innerText = `${data.length} item(s) na lista de pedidos`;

            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="prod-name">${p.Nome}</div>
                        <div class="prod-code"><i class="ri-barcode-box-line"></i> ${p.CodigoInterno || 'S/ Código'}</div>
                    </td>
                    <td>
                        <div style="font-weight: 500;">${p.Marca || '-'}</div>
                        <div style="color: var(--text-muted); font-size: 12px;">${p.Modelo || '-'}</div>
                    </td>
                    <td style="color: var(--danger); font-weight: 600;">
                        ${p.Estoque} un
                    </td>
                    <td style="color: var(--text-muted); font-weight: 500;">
                        ${p.EstoqueMinimo} un
                    </td>
                    <td>
                        <input type="number" min="0" class="input-qtd" value="${p.QtdPedir}" onchange="updateQtd(${p.Id}, this.value)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateQtd(id, value) {
            const item = produtosData.find(p => p.Id === id);
            if (item) {
                item.QtdPedir = parseInt(value) || 0;
            }
        }

        function copiarWhatsApp() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ action: 'copiar_whatsapp', data: produtosData });
            } else {
                console.log("Enviando WhatsApp", produtosData);
            }
        }

        function action(type) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ action: type });
            }
        }
    </script>
</body>
</html>
