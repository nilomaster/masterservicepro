<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container glass-card">
        <h2 id="pageTitle">Cadastro de Cliente</h2>
        
        <div class="header-actions">
            <button class="btn-link" id="btnFillNA">Preencher vazios com N/A</button>
        </div>

        <div class="form-grid">
            <div class="form-group span-2">
                <label>Nome do Cliente: *</label>
                <input type="text" id="nome" autocomplete="off" placeholder="Ex: João da Silva">
            </div>

            <div class="form-group">
                <label>CPF / CNPJ:</label>
                <input type="text" id="cpf" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Saldo Inicial (R$):</label>
                <input type="text" id="saldo" class="input-money" value="0,00" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Telefone:</label>
                <input type="text" id="telefone" autocomplete="off">
            </div>

            <div class="form-group">
                <label>WhatsApp:</label>
                <input type="text" id="whatsapp" autocomplete="off">
            </div>

            <div class="form-group span-2">
                <label>Email:</label>
                <input type="email" id="email" autocomplete="off">
            </div>

            <div class="form-group span-2">
                <label>Endereço:</label>
                <input type="text" id="endereco" autocomplete="off">
            </div>

            <div class="form-group span-2">
                <label>Histórico / Observações:</label>
                <textarea id="historico" rows="3"></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-outline" id="btnCancel">CANCELAR</button>
            <button class="btn btn-primary" id="btnConfirm">SALVAR</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
