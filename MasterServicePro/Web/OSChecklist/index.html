<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Checklist Técnico</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
    <div class="container">
        <h2>CHECKLIST TÉCNICO DE ENTRADA</h2>

        <div class="grid" id="checklistGrid">
            <!-- Items generated by JS -->
        </div>

        <div class="form-group mt-3">
            <label>Observações Adicionais / Detalhes Visuais:</label>
            <textarea id="txtObs" rows="3"></textarea>
        </div>

        <div class="footer-actions">
            <button class="btn btn-danger" onclick="sendAction('CANCEL')">CANCELAR</button>
            <button class="btn btn-success" onclick="saveChecklist()">SALVAR CHECKLIST</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
