<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container glass-card">
        <h2 id="pageTitle">Cadastro de Usuário</h2>
        
        <div class="form-group">
            <label>Usuário: *</label>
            <input type="text" id="username" autocomplete="off" placeholder="Ex: admin">
        </div>

        <div class="form-group">
            <label>Senha:</label>
            <input type="password" id="password" autocomplete="off" placeholder="Deixe em branco para manter a atual">
        </div>

        <div class="form-group">
            <label>Nível de Acesso:</label>
            <select id="nivel">
                <option value="Funcionário">Funcionário</option>
                <option value="Admin">Administrador</option>
            </select>
        </div>

        <div class="actions">
            <button class="btn btn-outline" id="btnCancel">CANCELAR</button>
            <button class="btn btn-primary" id="btnConfirm">SALVAR</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
