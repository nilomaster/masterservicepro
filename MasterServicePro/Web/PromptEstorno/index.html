<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estorno</title>
    <style>
        :root {
            --bg-body: #131722;
            --bg-card: #1e222d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
            --input-bg: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 0;
            user-select: none;
        }

        .modal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            text-align: left;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .modal-body {
            padding: 20px 22px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        /* Custom scrollbar */
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .modal-body::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        select.form-control {
            cursor: pointer;
        }

        select.form-control option {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 8px;
        }

        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border-color: #475569;
        }

        .btn-danger {
            background: var(--danger);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
        }

        .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="modal-container">
        <div class="modal-header">
            <h2 id="lblTitle">Cancelar Venda</h2>
            <button type="button" class="close-btn" id="btnClose" title="Fechar (Esc)">✕</button>
        </div>
        <div class="modal-body">
            
            <div class="form-group" id="groupDestino" style="display: none;">
                <label class="form-label" for="selDestino">Destino do Valor:</label>
                <select id="selDestino" class="form-control">
                    <option value="SALDO">Gerar Crédito (Saldo na conta do cliente)</option>
                    <option value="SANGRIA">Devolver Dinheiro (Saída do Caixa)</option>
                </select>
            </div>

            <div class="form-group" id="groupFormaPagamento" style="display: none;">
                <label class="form-label" for="selFormaPagamento">Forma de Pagamento (Devolução):</label>
                <select id="selFormaPagamento" class="form-control">
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Transferência">Transferência</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" id="lblInputTitle" for="txtInput">Motivo do Estorno:</label>
                <input type="text" id="txtInput" class="form-control" autocomplete="off">
                <div id="errorMsg" class="error-msg">Por favor, preencha este campo.</div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btnCancel" class="btn btn-cancel" type="button">Cancelar (Esc)</button>
            <button id="btnConfirm" class="btn btn-danger" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Aprovar Cancelamento
            </button>
        </div>
    </div>

    <script>
        // Setup WebView2 message receiver
        window.chrome.webview.addEventListener('message', event => {
            const data = event.data;
            if (data.action === "LOAD_DATA") {
                if (data.title) {
                    document.getElementById('lblTitle').innerText = data.title;
                }
                if (data.placeholder) {
                    document.getElementById('txtInput').placeholder = data.placeholder;
                }
                
                if (data.showDestino) {
                    document.getElementById('selDestino').innerHTML = `
                        <option value="ERRO_LANCAMENTO">Apenas Cancelar (Erro de Lançamento / Não tirar dinheiro)</option>
                        <option value="SALDO">Gerar Crédito (Saldo na conta do cliente)</option>
                        <option value="SANGRIA">Devolver Dinheiro (Saída do Caixa)</option>
                    `;
                } else {
                    document.getElementById('selDestino').innerHTML = `
                        <option value="ERRO_LANCAMENTO">Apenas Cancelar (Erro de Lançamento / Não tirar dinheiro)</option>
                        <option value="SANGRIA">Devolver Dinheiro (Saída do Caixa)</option>
                    `;
                }
                document.getElementById('groupDestino').style.display = 'flex';
                
                toggleFormaPagamento();
                
                setTimeout(() => {
                    document.getElementById('txtInput').focus();
                }, 100);
            }
        });

        document.getElementById('selDestino').addEventListener('change', toggleFormaPagamento);

        function toggleFormaPagamento() {
            const selDestino = document.getElementById('selDestino');
            const groupFormaPagamento = document.getElementById('groupFormaPagamento');
            if (selDestino.value === 'SANGRIA') {
                groupFormaPagamento.style.display = 'flex';
            } else {
                groupFormaPagamento.style.display = 'none';
            }
        }

        function cancel() {
            window.chrome.webview.postMessage({ action: "CANCEL" });
        }

        document.getElementById('btnCancel').addEventListener('click', cancel);
        document.getElementById('btnClose').addEventListener('click', cancel);

        document.getElementById('btnConfirm').addEventListener('click', () => {
            confirm();
        });

        document.getElementById('txtInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirm();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cancel();
            }
        });

        function confirm() {
            const input = document.getElementById('txtInput');
            const val = input.value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const selDestino = document.getElementById('selDestino');
            const selFormaPagamento = document.getElementById('selFormaPagamento');
            
            if (!val) {
                errorMsg.style.display = 'block';
                input.style.borderColor = 'var(--danger)';
                input.focus();
                return;
            }
            
            errorMsg.style.display = 'none';
            input.style.borderColor = 'var(--border)';
            
            window.chrome.webview.postMessage({
                action: "CONFIRMAR",
                value: val,
                destino: selDestino.value,
                formaPagamento: (selDestino.value === 'SANGRIA') ? selFormaPagamento.value : ''
            });
        }
    </script>
</body>
</html>
