<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção de Produto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container glass-card">
        <h2 id="pageTitle">Cadastro de Produto</h2>
        
        <div class="form-grid">
            <div class="form-group span-2">
                <label>Nome do Produto: *</label>
                <input type="text" id="nome" autocomplete="off" placeholder="Ex: Adaptador de Vídeo">
            </div>

            <div class="form-group span-2">
                <label>Código de Barras:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="codigoBarras" autocomplete="off" placeholder="Deixe em branco para gerar auto." style="flex: 1;">
                    <button id="btnGerarCodigo" class="btn btn-secondary" style="padding: 10px 15px;" title="Gerar Código Aleatório">
                        <i class="ri-barcode-box-line" style="font-size: 16px;"></i> GERAR
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Marca:</label>
                <input type="text" id="marca" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Modelo:</label>
                <input type="text" id="modelo" autocomplete="off">
            </div>

            <div class="form-group span-2">
                <label>Imagem do Produto (Opcional):</label>
                <div class="file-upload-wrapper" onclick="document.getElementById('imagemProduto').click()">
                    <div id="previewContainer" class="preview-container">
                        <i class="ri-image-add-line" id="previewIcon"></i>
                        <span id="previewText">Clique para escolher uma imagem</span>
                        <img id="imagemPreview" style="display: none;">
                    </div>
                    <input type="file" id="imagemProduto" accept=".png, .jpg, .jpeg, .webp, .gif" style="display: none;">
                </div>
            </div>

            <div class="form-group span-2">
                <label>Categoria:</label>
                <select id="categoria">
                    <option value="0">Selecione uma Categoria...</option>
                    <!-- Preenchido via JS -->
                </select>
            </div>

            <div class="form-group span-2">
                <label>Fornecedor:</label>
                <select id="fornecedor">
                    <option value="0">Selecione um Fornecedor...</option>
                    <!-- Preenchido via JS -->
                </select>
            </div>

            <div class="form-group span-2">
                <label>Garantia:</label>
                <select id="garantia">
                    <option value="Sem Garantia">Sem Garantia</option>
                    <option value="30 Dias">30 Dias</option>
                    <option value="90 Dias">90 Dias</option>
                    <option value="1 Ano">1 Ano</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preço Custo (R$):</label>
                <input type="text" id="precoCusto" class="input-money" value="0,00" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Preço Venda (R$):</label>
                <input type="text" id="precoVenda" class="input-money" value="0,00" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Estoque Atual:</label>
                <input type="number" id="estoque" value="0" min="0">
            </div>

            <div class="form-group">
                <label>Estoque Mínimo:</label>
                <input type="number" id="estoqueMinimo" value="0" min="0">
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-outline" id="btnCancel">CANCELAR</button>
            <button class="btn btn-primary" id="btnConfirm">SALVAR</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
