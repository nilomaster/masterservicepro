<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Caixas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container glass-card">
        <h2 id="pageTitle">Histórico de Caixas Fechados</h2>
        <p class="subtitle">Clique em um registro para visualizar os dados</p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Abertura</th>
                        <th>Fechamento</th>
                        <th>Vlr Inicial</th>
                        <th>Vlr Final</th>
                    </tr>
                </thead>
                <tbody id="tbBody">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>

        <div class="actions">
            <button class="btn btn-outline" id="btnCancel">FECHAR</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
